# Single configuration for the Kittur pipeline. All paths are relative to project_root,
# which is itself relative to the directory containing this file (release/code -> ../..).
project_root: ../..
crs: EPSG:32643            # WGS 84 / UTM zone 43N, used for all analysis grids
seed: 1824                 # Monte Carlo seed

paths:
  raw: raw                               # inputs exactly as downloaded (sha256 in release/PROVENANCE.csv)
  provenance: release/PROVENANCE.csv
  soi_scans: historical_maps/raw         # Survey of India 1924 one-inch sheet scans (Zenodo 10.5281/zenodo.18133392)
  corona_scans: corona                   # extracted CORONA scan pieces (<entity>_<a-d>.tif); re-extracted from raw/corona/*.tgz if absent
  natural_earth: raw/natural_earth
  sites: sites                           # comparison sites (Srirangapatna, Hampi, Belgaum): sites/<name>/raw, corona
  previews: previews                     # quick-look PNGs (regenerated by the figures stage)
  lite: ../kittur_map_lite               # lightweight shareable copy (stage 'lite')
  lite_zip: ../kittur_basemap_lite.zip
  derived: derived                       # regenerated rasters and vectors (pipeline output)
  results: results                       # JSON/CSV analysis results (pipeline output)
  legacy_rasters: qgis/rasters           # earlier exploratory outputs, used ONLY for regression checks
  legacy_results: release/data
  figures: manuscript/figures
  tables: manuscript/tables
  log: release/LOG.md

inputs:
  dem: raw/dem/cop_dem30_elevation.tif                       # Copernicus GLO-30, UTM 43N 30 m subset
  s2_dry: raw/sentinel/s2_dry_20260217_truecolour.tif        # georeferencing reference (Sentinel-2 L2A 17 Feb 2026)
  s2_dry_ndvi: raw/sentinel/s2_dry_20260217_ndvi.tif
  osm: raw/osm/osm_raw.gpkg
  corona_footprints: analysis/corona_footprints.csv          # USGS frame footprints (corner lon/lat) near Kittur
  regional_forts: release/data/regional_forts.csv            # gazetteer forts: reading of 1968/2026 imagery (curated)
  epochs: {L1990: raw/landsat/L1990, L2000: raw/landsat/L2000, L2010: raw/landsat/L2010,
           S2016: raw/sentinel/S2016, S2020: raw/sentinel/S2020, S2026: raw/sentinel/S2026}   # .tif (5-band median) + .json (scene IDs)
  soi_sheets:   # sheet scan, scan width used when the corner pixels were read, corner pixels (x0,y0,x1,y1), NW corner lon/lat; 15' sheets
    48_I_14: {file: 48_I_14_Belgaum_District__1924_.jpg, ref_width: 840, corners: [60, 105, 785, 858], nw: [74.75, 15.75]}
    48_I_13: {file: 48_I_13_Belgaum_District__1924_.jpg, ref_width: 848, corners: [47, 88, 800, 842], nw: [74.75, 16.0]}
    48_I_10: {file: 48_I_10_Belgaum_District__1924__c.jpg, ref_width: 708, corners: [53, 75, 667, 692], nw: [74.5, 15.75]}
    48_I_09: {file: 48_I_09_Belgaum_District__1924__c.jpg, ref_width: 830, corners: [57, 95, 775, 832], nw: [74.5, 16.0]}

corona:
  # entity -> acquisition date, camera, piece used
  frames:
    DS1045-1102DA224: {date: 1968-01-31, camera: KH-4A aft,     piece: b}
    DS1045-1102DF224: {date: 1968-01-31, camera: KH-4A forward, piece: c}
    DS1045-1102DA223: {date: 1968-01-31, camera: KH-4A aft,     piece: b}
    DS1044-2134DA217: {date: 1967-11-11, camera: KH-4A aft,     piece: d}
    DS1044-2134DF217: {date: 1967-11-11, camera: KH-4A forward, piece: a}
  # Recorded affine transforms (params/*.json) applied to the scans; see README for how they were fitted.
  da224_crops:      # DA224 piece b -> Sentinel-2 10 m window (+-6 km about window_lonlat) -> 2 m UTM grid centred on centre_lonlat
    kittur:   {params: params/gcp_kittur.json,   window_lonlat: [74.7911, 15.6004], centre_lonlat: [74.79107, 15.60044], half_m: 2500, res_m: 2}
    nandagad: {params: params/gcp_nandagad.json, window_lonlat: [74.5737, 15.5789], centre_lonlat: [74.57366, 15.57888], half_m: 2500, res_m: 2}
  df224_crops:      # DF224 piece c, affine F (scan px -> UTM)
    sangolli: {params: params/df224_F2.json, origin: [479183, 1741856], n: 3000, res_m: 2}
  da223_sites:      # coarse frame placement (utm2raw) + per-site NCC shift vs Sentinel-2
    params: params/da223_coarse.json
    shifts: params/da223_sites.json
    half_m: 2000
    res_m: 2
    sites: {sampgaon: [15.7954, 74.7585], bailhongal: [15.8164, 74.8569], oldsangoli: [15.74663, 74.83368], tigadi: [15.8023, 74.7210]}
  coreg_1967:       # co-registration to the 1968 Kittur crop by SIFT + RANSAC + 2nd-order polynomial
    DA217: {entity: DS1044-2134DA217, piece: d, out: corona_1967DA_kittur}
    DF217: {entity: DS1044-2134DF217, piece: a, out: corona_1967DF_kittur}
    DF224: {entity: DS1045-1102DF224, piece: c, out: corona_1968DF_kittur, prior: params/df224_F2.json}
  mosaic15: {centre_lonlat: [74.785, 15.598], half_m: 16000, res_m: 10, df224_max_row: 9100}

sites:   # comparison sites: recorded affine (sites/<name>/corona/*_fit.json, scan px -> S2 10 m px)
  srirangapatna: {fit: sites/srirangapatna/corona/DA028_fit.json, s2: sites/srirangapatna/raw/sentinel/S2B_43PFP_20260204_0_L2A_5band.tif,
                  piece: sites/srirangapatna/corona/DS1040-1039DA028/DS1040-1039DA028_d.tif, origin: [681532, 1376259], n: 2500, res_m: 2,
                  label: "CORONA KH-4A DS1040-1039DA028, 2 Apr 1967", s2_label: "Sentinel-2 L2A, 4 Feb 2026"}
  hampi:         {fit: sites/hampi/corona/DA077_fit.json, s2: "sites/hampi/raw/sentinel/S2B_43PFS+PFT_20260306_merged_5band.tif",
                  piece: sites/hampi/corona/DS1025-1071DA077/DS1025-1071DA077_b.tif, origin: [654229, 1698407], n: 2500, res_m: 2,
                  label: "CORONA KH-4A DS1025-1071DA077, 10 Oct 1965", s2_label: "Sentinel-2 L2A, 6 Mar 2026"}
  belgaum:       {fit: sites/belgaum/corona/DA222_fit.json, s2: sites/belgaum/raw/sentinel/S2B_43PDT_20260207_0_L2A_5band.tif,
                  piece: sites/belgaum/corona/DS1045-1102DA222/DS1045-1102DA222_b.tif, origin: [446344.332406707, 1756383.84610198], n: 2500, res_m: 2,
                  label: "CORONA KH-4A DS1045-1102DA222, 31 Jan 1968", s2_label: "Sentinel-2 L2A, 7 Feb 2026",
                  legacy: sites/belgaum/qgis/corona_1968_DA222_belgaum.tif}

site_epochs:   # dry-season 6 x 6 km medians per comparison site (sites/<name>/raw/epochs/<epoch>.tif + .json)
  epochs: [L1990, L2000, L2010, S2016, S2020, S2026]
  centres_latlon: {srirangapatna: [12.4216, 76.6930], hampi: [15.3350, 76.4600], belgaum: [15.8634, 74.5222]}
  radii_m: [1500, 2500]
  legacy: release/data/sites_epoch_metrics.csv

belgaum_fort:  # moat traced by eye on corona_belgaum.tif (2 m) - params/belgaum_moat.yaml
  trace: params/belgaum_moat.yaml
  legacy: sites/belgaum/analysis/fort_digitized.json   # regression check only
  gazetteer_acres: 100      # Gazetteer 1884: Belgaum fort encloses about 100 acres

dem_stereo:
  sgbm: {min_disparity: -16, num_disparities: 32, block_size: 15, uniqueness: 10, speckle_window: 100, speckle_range: 2}
  highpass_sigma_px: 16      # remove illumination/tone gradients before matching (parameter sweep in LOG.md)
  calib_block_m: 30
  smooth_m: 16

features:  # digitised on the 1968 Kittur crop (pixel col,row on the 2 m grid); see params/features_1968.yaml
  file: params/features_1968.yaml

viewshed:
  eye_height_m: 10
  refraction_k: 0.13
  max_dist_m: 25000
  n_rays: 2880
  step_m: 10

lcp:
  slope_ref_deg: 4.0
  dark_tone_factor: 2.0
  pond_cost: 50
  moat_cost: 25
  moat_buffer_m: 15
  gate_offset_m: 25
  starts: {Belgaum_NW: [74.5000, 15.8670], Dharwad_SE: [75.0100, 15.4580]}

montecarlo:
  n: 1000
  translation_rms_m: 25
  edge_rms_range_m: [50, 100]
  edge_dist_m: 2500
  local_residual_m: 10
  vertex_noise_m: 4
  vertical_sd_m: {copernicus: 2.0, stereo: 10.0}

points:   # lat, lon (gazetteer.csv; OSM / Wikidata)
  Kittur fort: [15.60044, 74.79107]
  Old Sangoli (1968 village): [15.74663, 74.83368]
  Sangolli (present): [15.71715, 74.83370]
  Nandagad: [15.57667, 74.56927]
  Bailhongal: [15.81642, 74.85687]
  Belgaum fort: [15.86185, 74.52447]
  Sampgaon: [15.7954, 74.7585]
  Tigadi: [15.8023, 74.7210]
  Dharwad: [15.45898, 75.00779]
  Srirangapatna: [12.4216, 76.6806]
  Hampi: [15.3350, 76.4600]

validation:   # stage 12: independent tie points and transform comparison (see stages/s12_validation.py)
  min_sep_m: 300          # minimum spacing of OSM candidate features
  res_m: 4                # matching grid (CORONA and SoI)
  half_m: [350, 500]      # two template half-sizes that must agree
  agree_m: 15             # max disagreement between the two template sizes
  min_z: 0.0              # optional min NCC peak height above the correlation surface (sd); 0 = off (depends on search size)
  min_ncc: 0.30           # min NCC peak
  search1_m: 400          # pass 1 search radius about the recorded transform
  search2_m: 120          # pass 2 search radius about the RANSAC-updated prediction
  ransac_m: 60
  blunder_m: 60           # gross-error screen against a robust 2nd-order fit (flagged points listed separately)
  control_frac: 0.7
  k_blocks: 5
  n_boot: 500
  models: [affine, poly2, poly3, tps]
  # One-at-a-time sensitivity (Kittur CORONA). The Kittur-area targets override min_ncc to 0.20 (see 'match');
  # 0.30 leaves only 2 ties there, so the lower threshold is kept and its effect is carried into stage 13.
  sensitivity: {min_ncc: [0.15, 0.25, 0.30], agree_m: [10, 20], min_sep_m: [400, 500], exclude_kinds: [[tank, village]]}
  targets:
    corona_da224_kittur: {kind: corona, label: "CORONA KH-4A DS1045-1102DA224 (31 Jan 1968) Kittur", entity: DS1045-1102DA224, piece: b,
                          transform: da224_An, crop: kittur, cues: [road, s2], match: {min_ncc: 0.2}, bbox_utm: [469606, 1716746, 485606, 1732746],
                          inner_bbox_utm: [474606, 1721746, 480606, 1727746], inner_min_sep_m: 150,
                          v2_crop: {centre_lonlat: [74.79107, 15.60044], half_m: 2500, res_m: 2, out: corona_1968_kittur_v2.tif}}
    corona_df224_sangolli: {kind: corona, label: "CORONA KH-4A DS1045-1102DF224 (31 Jan 1968) Sangolli", entity: DS1045-1102DF224, piece: c,
                            cues: [road, s2], match: {min_ncc: 0.2}, transform: df224_F, params: params/df224_F2.json, bbox_utm: [474185, 1732913, 490185, 1748913],
                            v2_crop: {centre_lonlat: [74.8337, 15.7466], half_m: 3000, res_m: 2, out: corona_1968_sangolli_v2.tif}}
    corona_da224_nandagad: {kind: corona, label: "CORONA KH-4A DS1045-1102DA224 (31 Jan 1968) Nandagad", entity: DS1045-1102DA224, piece: b,
                            transform: da224_An, crop: nandagad, cues: [road, s2], match: {min_ncc: 0.2}, bbox_utm: [448295, 1716402, 460295, 1728402]}
    soi_48I14: {kind: soi, label: "Survey of India 48 I/14 (1924)", sheet: derived/soi/SoI_48_I_14_1924_cornergeoref.tif,
                bbox_utm: [473723, 1714198, 494644, 1740730],
                v2_crop: {centre_lonlat: [74.81, 15.665], half_m: 9500, res_m: 5, out: SoI_48_I_14_1924_kittur_sangolli_v2.tif}}
    soi_48I10: {kind: soi, label: "Survey of India 48 I/10 (1924)", sheet: derived/soi/SoI_48_I_10_1924_cornergeoref.tif,
                bbox_utm: [446910, 1714244, 472683, 1740746]}
    corona_da222_belgaum: {kind: corona, label: "CORONA KH-4A DS1045-1102DA222 (31 Jan 1968) Belgaum", entity: DS1045-1102DA222, piece: b,
                           scan: sites/belgaum/corona/DS1045-1102DA222/DS1045-1102DA222_b.tif, transform: site_fit, site: belgaum,
                           cues: [road, s2], match: {min_ncc: 0.2}, bbox_utm: [442844, 1747884, 454844, 1759884]}
    soi_48I09: {kind: soi, label: "Survey of India 48 I/09 (1924)", sheet: derived/soi/SoI_48_I_09_1924_cornergeoref.tif,
                bbox_utm: [446975, 1741897, 472703, 1757338]}

    # Transferability (v3): two other CORONA missions in other regions, run with the SAME settings.
    corona_da028_srirangapatna: {kind: corona, label: "CORONA KH-4A DS1040-1039DA028 (2 Apr 1967) Srirangapatna", entity: DS1040-1039DA028, piece: d,
                                 scan: sites/srirangapatna/corona/DS1040-1039DA028/DS1040-1039DA028_d.tif, transform: site_fit, site: srirangapatna,
                                 osm: sites/srirangapatna/raw/osm/osm_raw.gpkg, s2: sites/srirangapatna/raw/sentinel/S2B_43PFP_20260204_0_L2A_5band.tif,
                                 cues: [road, s2], match: {min_ncc: 0.2}, bbox_utm: [678031, 1367759, 690031, 1379759], transfer: true}
    corona_da077_hampi: {kind: corona, label: "CORONA KH-4A DS1025-1071DA077 (10 Oct 1965) Hampi", entity: DS1025-1071DA077, piece: b,
                         scan: sites/hampi/corona/DS1025-1071DA077/DS1025-1071DA077_b.tif, transform: site_fit, site: hampi,
                         osm: sites/hampi/raw/osm/osm_raw.gpkg, s2: "sites/hampi/raw/sentinel/S2B_43PFS+PFT_20260306_merged_5band.tif",
                         cues: [road, s2], match: {min_ncc: 0.2}, bbox_utm: [650729, 1689907, 662729, 1701907], transfer: true}

propagation:   # stage 13: empirical georeferencing uncertainty carried downstream
  n: 1000                # bootstrap realisations (r3: raised from 200; 95% half-widths from 200 draws scatter by about +-12%)
  n_components: 1000     # r3: one-at-a-time component runs (was default 100, too few for stable percentiles)
  rays: 720              # viewshed rays per realisation (stage 06 uses 2880 for the nominal map)
  viewshed_max_m: 10000
  n_vertical: 500        # DSM-noise realisations for the commanding-ground test
  dsm_corr_m: 90         # correlation length of the DSM error field
  dsm_sd_scenarios_m: [2.0, 3.0, 5.0]   # v3: GLO-30 vertical error scenarios (reviewer M4: 3-5 m under trees/buildings)
  canopy_bias_max_m: 5.0 # v3: one-sided canopy bias, U(0, max) m removed from cells with dry-season NDVI > canopy_ndvi
  canopy_ndvi: 0.45
  digitising_sd_m: 5.0   # v3: systematic line-placement error of an eye-traced boundary on 2 m CORONA (ASSUMED until
                         # the repeat-digitising exercise in manuscript/blind_grading/ is done by a second analyst)
  old_sangoli_lonlat: [74.8337, 15.7466]   # 1968 village centre on the v1 DF224 crop (findings 6)
