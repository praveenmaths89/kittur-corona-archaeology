# Provenance rules for stage 'provenance' (stages/s00_provenance.py). First matching regex (on the project-relative
# path) wins. {entity} / {epoch} / {site} are filled from the path. Acquisition dates for CORONA entities are below.
scan_roots: [raw, historical_maps/raw, sites/*/raw]
skip: ['(^|/)\.', '\.aux\.xml$']
corona_dates:
  DS1044-2134DA217: 1967-11-11
  DS1044-2134DF217: 1967-11-11
  DS1045-1102DA222: 1968-01-31
  DS1045-1102DF223: 1968-01-31
  DS1045-1102DA223: 1968-01-31
  DS1045-1102DA224: 1968-01-31
  DS1045-1102DF224: 1968-01-31
  DS1040-1039DA028: 1967-04-02
  DS1025-1071DA094: 1965-10-10
  DS1025-1071DA077: 1965-10-10
  DS1025-1071DF071: 1965-10-10
rules:
  - {re: '(^|/)raw/corona/SHA256\.txt$', source: 'sha256 of the downloaded CORONA archives (original download and copy)', acquisition: '-', license: '-', script: '-'}
  - {re: 'raw/corona/(?P<entity>DS[0-9A-Z-]+)\.tgz$', source: 'USGS EarthExplorer, Declassified Data 1 (corona2), entity {entity}', acquisition: '{corona_date}', license: 'Public domain (USGS)', script: 'stages/s01_fetch.py (--download corona); s03_georeference.py'}
  - {re: '^sites/(?P<site>[a-z]+)/raw/epochs/(?P<epoch>L\d{4})\.(tif|json)$', source: 'USGS Landsat Collection 2 Level-2 via Microsoft Planetary Computer; dry-season median, scene IDs in {epoch}.json', acquisition: 'see {epoch}.json', license: 'Public domain (USGS)', script: 'sites/common/epoch_fetch.py; stages/s05_metrics.py'}
  - {re: '^sites/(?P<site>[a-z]+)/raw/epochs/(?P<epoch>S\d{4})\.(tif|json)$', source: 'Element84 Earth Search sentinel-2-l2a; dry-season median, scene IDs in {epoch}.json', acquisition: 'see {epoch}.json', license: 'Copernicus Sentinel data (free, full and open; attribution required)', script: 'sites/common/epoch_fetch.py; stages/s05_metrics.py'}
  - {re: '^sites/(?P<site>[a-z]+)/raw/sentinel/', source: 'Element84 Earth Search sentinel-2-l2a, single dry-season scene (5-band subset; s2_meta.json)', acquisition: 'see s2_meta.json', license: 'Copernicus Sentinel data 2026 (free, full and open; attribution required)', script: 'sites/common/fetch_s2.py'}
  - {re: '^sites/(?P<site>[a-z]+)/raw/SoI_', source: 'Zenodo 10.5281/zenodo.18133392 "Old Survey of India Maps" (corner georeference)', acquisition: 'surveyed 1922-23, publ. 1924', license: 'CC-BY-4.0 (Zenodo record, checked 2026-10-20)', script: 'legacy/base/georef.py'}
  - {re: '^raw/sentinel/s1_', source: 'Microsoft Planetary Computer sentinel-1-rtc, S1D 2026-10-19T00:55 frames', acquisition: '2026-10-19', license: 'Copernicus Sentinel data 2026 (free, full and open; attribution required)', script: 'legacy/base/s1.py (not used by the pipeline)'}
  - {re: '^raw/sentinel/', source: 'Element84 Earth Search sentinel-2-l2a; item IDs in the epoch JSON or README (window subsets; s2_* are stretched composites)', acquisition: 'see item ID', license: 'Copernicus Sentinel data 2016-2026 (free, full and open; attribution required)', script: 'stages/_stac.py; s01_fetch.py'}
  - {re: '^raw/landsat/', source: 'USGS Landsat Collection 2 Level-2 via Microsoft Planetary Computer; item IDs in JSON', acquisition: '1990-2010; 1999-03-04', license: 'Public domain (USGS)', script: 'stages/_stac.py; s01_fetch.py'}
  - {re: '^raw/dem/', source: 'Copernicus DEM GLO-30, s3 copernicus-dem-30m tile N15 E074 (reprojected subset)', acquisition: '2011-2015', license: 'Copernicus DEM licence (free; (c) DLR e.V. 2010-2014 and (c) Airbus 2014-2018, provided under COPERNICUS by the EU and ESA)', script: 'stages/s01_fetch.py (--download dem)'}
  - {re: '^raw/soi/', source: 'Zenodo 10.5281/zenodo.18133392 "Old Survey of India Maps", corner georeference (legacy)', acquisition: 'surveyed 1922-23, publ. 1924', license: 'CC-BY-4.0 (Zenodo record, checked 2026-10-20)', script: 'legacy/base/georef.py (regenerated by s02_preprocess.py)'}
  - {re: '^historical_maps/raw/', source: 'Zenodo 10.5281/zenodo.18133392 "Old Survey of India Maps" (scans of SoI one-inch sheets)', acquisition: 'surveyed 1922-23, publ. 1924', license: 'CC-BY-4.0 (Zenodo record, checked 2026-10-20)', script: 'stages/s01_fetch.py (--download soi); s02_preprocess.py'}
  - {re: '^raw/osm/', source: 'OpenStreetMap via Overpass (kumi mirror)', acquisition: '2026-10-20', license: 'ODbL 1.0 ((c) OpenStreetMap contributors)', script: 'legacy/base/osm.py'}
  - {re: '^raw/natural_earth/', source: 'Natural Earth (naciscdn.org), 1:10m admin-1 and 1:50m land/coastline', acquisition: 'v5 (2018+)', license: 'Public domain', script: 'stages/s01_fetch.py (--download natural_earth)'}
  - {re: '^raw/texts/belgaum1884', source: 'Gazetteer of the Bombay Presidency XXI, Belgaum (1884), archive.org OCR text', acquisition: '1884', license: 'Public domain text', script: 'stages/s01_fetch.py (--download gazetteer)'}
  - {re: '^raw/texts/', source: 'National Archives of India, Abhilekh Patal, Foreign Political 1824-25 (own transcriptions)', acquisition: '1824-25', license: 'Transcriptions CC-BY 4.0 (project)', script: '-'}
  - {re: '.*', source: 'unclassified', acquisition: '', license: '', script: ''}
